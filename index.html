<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newro Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent; /* Hapus bayangan biru pas ditekan di HP */
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: #0d0e15;
    }

    /* CONTAINER DENGAN LATAR BELAKANG GAMBAR */
    .container {
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(135deg, rgba(13, 14, 21, 0.75), rgba(28, 22, 43, 0.75)), 
                  url('https://i.ibb.co.com/23HZ7hRF/quality-restoration-20260614015516916.jpg') no-repeat center center;
      background-size: cover;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    /* Glass Card - TINGKAT BLUR DIKURANGI AGAR LEBIH JERNIH */
    .glass-card {
      position: relative;
      width: 100%;
      max-width: 400px;
      padding: 40px 28px;
      background: rgba(255, 255, 255, 0.05); /* Sedikit menaikkan opasitas dasar */
      border-radius: 28px;
      backdrop-filter: blur(8px) saturate(140%); /* Blur diturunkan dari 25px ke 8px */
      -webkit-backdrop-filter: blur(8px) saturate(140%);
      border: 1px solid rgba(255, 225, 140, 0.25); /* Garis tepi pembatas dipertegas */
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
                  inset 0 1px 1px rgba(255, 255, 255, 0.2);
      text-align: center;
      opacity: 0;
      transform: translateY(40px);
      animation: cardEntrance 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes cardEntrance {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Profile Header */
    .profile-img-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 22px auto;
    }

    .profile-img-wrapper::before {
      content: '';
      position: absolute;
      top: -3px; left: -3px; right: -3px; bottom: -3px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffe082, #ffb300);
      z-index: -1;
      filter: blur(3px);
      opacity: 0.8;
    }

    .profile-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(20, 21, 31, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
    }

    /* Warna Icon Font Awesome Profile */
    .profile-avatar i {
      font-size: 38px;
      color: #ffd54f;
    }

    .profile-name {
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 30px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    /* Links Container */
    .links-wrapper {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Button Style Premium */
    .link-btn {
      background: rgba(255, 255, 255, 0.04);
      position: relative;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      outline: none;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.9);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
      backdrop-filter: blur(4px);
      
      /* Transisi halus */
      transition: color 0.4s cubic-bezier(0.25, 1, 0.4, 1), 
                  border-color 0.4s ease, 
                  transform 0.3s cubic-bezier(0.25, 1, 0.4, 1),
                  box-shadow 0.3s ease;
      
      opacity: 0;
      transform: translateY(25px);
      animation: itemEntrance 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes itemEntrance {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .link-btn span {
      margin-left: 16px;
      flex-grow: 1;
      text-align: left;
    }

    /* Styling Ikon Font Awesome di dalam tombol */
    .link-btn i.icon-main {
      font-size: 18px;
      width: 24px;
      text-align: center;
      color: #ffd54f;
      transition: color 0.4s cubic-bezier(0.25, 1, 0.4, 1);
    }

    .link-btn i.icon-arrow {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.3);
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.4, 1), color 0.4s ease;
    }

    /* Liquid Back-layer Animation */
    .link-btn::before {
      position: absolute;
      top: 0; left: -5em; right: 0; bottom: 0;
      margin: auto;
      content: '';
      border-radius: 50%;
      display: block;
      width: 32em; height: 32em;
      transition: box-shadow 0.6s cubic-bezier(0.25, 1, 0.4, 1);
      z-index: -1;
    }

    /* Hover States - Soft Gold Blend */
    .link-btn:hover {
      color: #0d0e15;
      border-color: #ffd54f;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(255, 213, 79, 0.2);
    }

    .link-btn:hover ::before {
      box-shadow: inset 0 0 0 22em #ffd54f;
    }

    .link-btn:hover i.icon-main {
      color: #0d0e15;
    }

    .link-btn:hover i.icon-arrow {
      color: #0d0e15;
      transform: translateX(4px);
    }
    
    /* Active State saat ditekan (BERSIH - Tanpa warna biru) */
    .link-btn:active {
      transform: translateY(-1px) scale(0.99);
      box-shadow: 0 5px 10px rgba(255, 213, 79, 0.15);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="glass-card">
      
      <div class="profile-img-wrapper">
        <div class="profile-avatar">
          <i class="fa-regular fa-user"></i>
        </div>
      </div>
      <h1 class="profile-name">Newro</h1>

      <div class="links-wrapper" id="linksContainer"></div>

    </div>
  </div>

  <script>
    // DATA TOMBOL MENGGUNAKAN CLASS FONT AWESOME (Gampang diedit)
    const buttonData = [
      {
        title: "Varnix APP",
        url: "https://example.com/varnix-app",
        iconClass: "fa-solid fa-cubes" // Ikon Font Awesome untuk aplikasi
      },
      {
        title: "Downloader Web",
        url: "https://example.com/downloader",
        iconClass: "fa-solid fa-cloud-arrow-down" // Ikon Font Awesome untuk download
      },
      {
        title: "Donate me",
        url: "https://example.com/donate",
        iconClass: "fa-solid fa-wallet" // Ikon Font Awesome untuk donasi
      },
      {
        title: "Contact Admin",
        url: "https://example.com/contact",
        iconClass: "fa-regular fa-comment-dots" // Ikon Font Awesome untuk chat
      }
    ];

    const containerEl = document.getElementById('linksContainer');
    
    buttonData.forEach((btn, index) => {
      const aTag = document.createElement('a');
      aTag.href = btn.url;
      aTag.className = 'link-btn';
      aTag.target = '_blank';
      aTag.rel = 'noopener noreferrer';
      
      aTag.style.animationDelay = `${(index + 1) * 0.08}s`;
      
      // Render susunan menggunakan Tag Ikon <i> milik Font Awesome
      aTag.innerHTML = `
        <i class="${btn.iconClass} icon-main"></i>
        <span>${btn.title}</span>
        <i class="fa-solid fa-chevron-right icon-arrow"></i>
      `;

      // Animasi respon klik yang tidak kaku
      aTag.addEventListener('click', function() {
        aTag.style.transform = 'scale(0.96)';
        setTimeout(() => {
          aTag.style.transform = 'translateY(-3px)';
        }, 150);
      });
      
      containerEl.appendChild(aTag);
    });

    // Efek Parallax 3D Card saat kursor bergerak
    const card = document.querySelector('.glass-card');
    const container = document.querySelector('.container');

    container.addEventListener('mousemove', (e) => {
      const xAxis = (window.innerWidth / 2 - e.clientX) / 35;
      const yAxis = (window.innerHeight / 2 - e.clientY) / 35;
      card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    container.addEventListener('mouseleave', () => {
      card.style.transition = 'transform 0.8s cubic-bezier(0.25, 1, 0.4, 1)';
      card.style.transform = 'rotateY(0deg) rotateX(0deg)';
    });

    container.addEventListener('mouseenter', () => {
      card.style.transition = 'none';
    });
  </script>
</body>
</html>
